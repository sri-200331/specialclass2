<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offers</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
    <div class="offers-container">

    <div class="offer-card">
        <h2>Free Chicken Zinger</h2>
        <p>On orders above ₹499</p>
        <h3>Code : FREEZINGER</h3>
        <button>Redeem</button>
    </div>

    <div class="offer-card">
        <h2>20% OFF</h2>
        <p>On orders above ₹699</p>
        <h3>Code : KFC20</h3>
        <button>Redeem</button>
    </div>

    <div class="offer-card">
        <h2>Free Pepsi</h2>
        <p>On Bucket Orders</p>
        <h3>Code : PEPSIFREE</h3>
        <button>Redeem</button>
    </div>


</div>
    <div class="coupon-banner">
        🎉 Use Coupon <span>KFC50</span> and Get ₹50 OFF
    </div>
    <div class="delivery">
        <h1>🚚 Free Delivery Available</h1>
        <p>On Orders Above ₹499</p>
    </div>

    
</body>
</html>
